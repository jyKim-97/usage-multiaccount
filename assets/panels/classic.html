<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #080d12;
      --panel: rgba(25, 33, 42, 0.86);
      --panel-border: rgba(255, 255, 255, 0.15);
      --line: rgba(255, 255, 255, 0.13);
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.58);
      --track: rgba(255, 255, 255, 0.07);
      --tick: rgba(255, 255, 255, 0.30);
      --button: rgba(255, 255, 255, 0.08);
      --button-border: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.13);
      --claude: #f49164;
      --codex: #58d6e6;
      --agy: #6b9aff;
      --grok: #e9e9ee;
      --projects: #30d158;
      --warn: #ffc439;
      --danger: #ff453a;
      --radius: 8px;
      /* Numeric readouts use the system mono face; no webfont, panel stays offline. */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef2f7;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-border: rgba(20, 28, 38, 0.14);
        --line: rgba(20, 28, 38, 0.13);
        --text: rgba(12, 18, 26, 0.9);
        --muted: rgba(12, 18, 26, 0.55);
        --track: rgba(12, 18, 26, 0.06);
        --tick: rgba(12, 18, 26, 0.26);
        --button: rgba(12, 18, 26, 0.05);
        --button-border: rgba(12, 18, 26, 0.14);
        --button-hover: rgba(12, 18, 26, 0.10);
        --agy: #3f74e8;
        --grok: #1c1c1f;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0;
      overscroll-behavior: none;
    }

    body {
      padding: 12px;
      background:
        linear-gradient(180deg, #111b25 0%, #0b1118 44%, var(--bg) 100%);
    }

    @media (prefers-color-scheme: light) {
      body {
        background:
          linear-gradient(180deg, #f8fafc 0%, #eef3f8 48%, var(--bg) 100%);
      }
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .card {
      padding: 13px 15px 12px;
    }

    .card[data-card="codex"],
    .card[data-card="agy"] {
      overflow: visible;
      z-index: 2;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 22%, transparent));
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    /* Chasing halo. No box-shadow anywhere: the effect is a conic gradient
       clipped to the card's own border ring, so it cannot bleed past the box
       even on the codex/agy cards, which are overflow:visible for tooltips. */
    @property --halo-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .card[data-critical="true"]::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      pointer-events: none;
      background: conic-gradient(from var(--halo-angle),
          transparent 0deg 232deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 286deg,
          var(--danger) 334deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 352deg,
          transparent 360deg);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      animation: halo-spin 2.6s linear infinite;
    }

    @keyframes halo-spin {
      to {
        --halo-angle: 360deg;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      height: 32px;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 6px 14px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .card[data-card="agy"] .brand-icon svg,
    .card[data-card="grok"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="agy"] .brand-icon,
    .card[data-card="grok"] .brand-icon {
      color: var(--accent);
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 21px;
      line-height: 1;
      font-weight: 800;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    /* With OpenCodex accounts shown, the card's own rows and their staleness
       badge describe Codex's session logs, which a proxied setup stops
       writing; each account block carries its own staleness instead. */
    .card[data-card="codex"][data-has-accounts="true"] > [data-row],
    .card[data-card="codex"][data-has-accounts="true"] [data-codex-stale] {
      display: none !important;
    }

    .codex-account + .codex-account {
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 8px;
    }

    .codex-account-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .codex-account[data-active="true"] .codex-account-name {
      color: var(--accent);
    }

    .codex-account[data-active="true"] .codex-account-name::before {
      content: "● ";
    }

    .codex-account-id {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }

    .codex-account-stale {
      margin-left: auto;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 700;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .card[data-card="agy"] .brand h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="agy"] .codex-stale {
      margin-left: auto;
    }

    .card[data-card="codex"] .brand.usage-switch-host h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="codex"] .brand.usage-switch-host .codex-stale {
      flex: 1 1 0;
      overflow: hidden;
    }

    .card[data-card="codex"] .brand.usage-switch-host [data-codex-stale-age] {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      height: auto;
      row-gap: 10px;
      margin-bottom: 10px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
    }

    .project-actions {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .project-actions .switch {
      width: 100%;
      min-width: 0;
    }

    .switch {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: var(--button);
      color: var(--text);
      font: 600 12px/26px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: nowrap;
    }

    .row + .row {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 8px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .row-title {
      font-size: 15px;
      line-height: 18px;
      font-weight: 700;
    }

    .percent {
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      /* Tick marks the 80% danger threshold from usage_rate's colorFor(). */
      background:
        linear-gradient(90deg,
          transparent 0 calc(80% - 1px),
          var(--tick) calc(80% - 1px) 80%,
          transparent 80%),
        var(--track);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.18);
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 4px;
      border-radius: inherit;
      background: var(--fill-color, var(--accent));
      background-image: linear-gradient(180deg, color-mix(in srgb, var(--fill-color, var(--accent)) 100%, white 12%), var(--fill-color, var(--accent)));
      box-shadow: 0 0 12px color-mix(in srgb, var(--fill-color, var(--accent)) 30%, transparent);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .reset {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .reset[data-warning="true"] {
      color: #ff3b30;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    /* min-width keeps a sub-1% bar visible; a genuine 0% must stay empty. */
    .fill[style*="width: 0%"] {
      min-width: 0;
    }

    .proj-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto auto;
      align-items: baseline;
      gap: 8px;
      padding: 8px 0 11px;
      font-size: 13.5px;
      line-height: 20px;
    }

    .proj-row:first-child {
      font-weight: 600;
    }

    .proj-rank {
      width: 16px;
      height: 16px;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 26%, transparent);
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
    }

    .proj-row:first-child .proj-rank {
      background: color-mix(in srgb, var(--projects) 32%, transparent);
      color: white;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-row:first-child .proj-name {
      color: var(--text);
    }

    .proj-tokens {
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
      min-width: 92px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-cost {
      color: color-mix(in srgb, var(--muted) 70%, transparent);
      font-size: 12px;
      white-space: nowrap;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-bar {
      grid-column: 1 / -1;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
      align-self: end;
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 72%, transparent), var(--accent));
      opacity: 0.7;
    }

    .proj-row:first-child .proj-bar {
      height: 3.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .footer {
      min-height: 144px;
      padding: 12px 15px 11px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta > div {
      padding: 3px 8px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--button) 78%, transparent);
      border: 1px solid var(--button-border);
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(220, 80, 60, 0.16);
      border: 1px solid rgba(220, 80, 60, 0.4);
      color: #ff9b85;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .today {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 15px;
      line-height: 20px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }


    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      height: auto;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: normal;
      min-width: 0;
      line-height: 1.3;
      flex: 1;
    }

    .action,
    .switch {
      transition:
        filter 80ms ease-out,
        transform 80ms ease-out,
        background 160ms ease-out,
        background-color 160ms ease-out,
        border-color 160ms ease-out,
        color 160ms ease-out;
    }

    .action:focus-visible,
    .switch:focus-visible {
      outline: 2px solid var(--accent, #58d6e6);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {

      .action,
      .switch,
      .fill {
        transition: none;
      }

      .card[data-critical="true"]::after {
        animation: none;
        background: color-mix(in srgb, var(--danger) 72%, transparent);
      }
    }

    .action:active,
    .switch:active {
      filter: brightness(0.82);
      transform: scale(0.98);
    }

    .action.primary {
      border-color: rgba(88, 214, 230, 0.30);
      background: linear-gradient(180deg, rgba(88, 214, 230, 0.26), rgba(24, 172, 216, 0.18));
      color: rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .action.primary:hover {
      border-color: rgba(88, 214, 230, 0.55);
      background: linear-gradient(180deg, #34d7f2, #18acd8);
      color: white;
    }

    .action:not(.primary):hover {
      background: var(--button);
      color: var(--text);
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }

    .switch:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .switch[data-active="true"] {
      color: white;
      border-color: rgba(48, 209, 88, 0.45);
      background: linear-gradient(180deg, rgba(48, 209, 88, 0.30), rgba(40, 180, 75, 0.20));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    @media (prefers-color-scheme: light) {
      .switch:hover {
        background: rgba(12, 18, 26, 0.10);
        border-color: rgba(12, 18, 26, 0.22);
      }
    }

    .attribution {
      font-size: 10px;
      color: rgba(255,255,255,0.18);
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    @media (prefers-color-scheme: light) {
      .attribution {
        color: rgba(12,18,26,0.30);
      }
    }




    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: 0.72; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24); transform: translateY(-2px); }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

    .card[data-card="agy"] .agy-group-toggle {
      flex: 0 0 auto;
      border: 1px solid color-mix(in srgb, var(--agy) 60%, transparent);
      border-radius: 999px;
      padding: 3px 6px;
      background: color-mix(in srgb, var(--agy) 12%, transparent);
      color: var(--agy);
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
    }
    .card[data-card="agy"] .brand h1 {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card[data-card="agy"] .agy-group-toggle:hover,
    .card[data-card="agy"] .agy-group-toggle:focus-visible {
      background: color-mix(in srgb, var(--agy) 25%, transparent);
    }

    /* ---- Compact skin (fork) ----------------------------------------------
       Modelled on a native SwiftUI menu-bar popover: one system typeface,
       headline/caption sizes, a single surface split by hairlines instead of
       floating cards. Kept as one override block so the upstream rules above
       stay untouched and merges only ever conflict here. */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
      --mono: var(--font);
      --bg: #1f2023;
      --line: rgba(255, 255, 255, 0.10);
      --track: rgba(255, 255, 255, 0.10);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f6;
        --line: rgba(0, 0, 0, 0.10);
        --track: rgba(0, 0, 0, 0.08);
      }
    }

    html,
    body,
    button,
    .switch,
    .action {
      font-family: var(--font);
    }

    body {
      padding: 6px 14px;
      background: var(--bg);
    }

    .wrap {
      gap: 0;
    }

    .card,
    .footer {
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .wrap > .card {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .card::before {
      display: none;
    }

    .card.is-dragging {
      background: var(--bg);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
    }

    .brand {
      height: 20px;
      gap: 7px;
      margin-bottom: 8px;
    }

    .brand img,
    .brand-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      box-shadow: none;
    }

    .brand-icon {
      font-size: 13px;
    }

    .card[data-card="agy"] .brand-icon svg,
    .card[data-card="grok"] .brand-icon svg,
    .brand-icon svg {
      width: 13px;
      height: 13px;
    }

    .brand h1 {
      font-size: 13px;
      font-weight: 600;
      line-height: 16px;
    }

    /* One text line per quota (title, reset, percent on a shared baseline)
       over the bar, instead of title / bar / reset on three lines. The row
       markup comes from panel_core.js, so the regrouping is done in CSS. */
    .row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "title reset percent"
        "track track track";
      align-items: baseline;
      column-gap: 6px;
      row-gap: 4px;
    }

    .row + .row {
      border-top: 0;
      margin-top: 8px;
      padding-top: 0;
    }

    .row-head {
      display: contents;
    }

    .row-title {
      grid-area: title;
      font-size: 12px;
      line-height: 15px;
      font-weight: 400;
    }

    .percent {
      grid-area: percent;
      font-size: 12px;
      line-height: 15px;
      font-weight: 600;
    }

    /* No 80% tick: the percent colour already turns at the thresholds. */
    .track {
      grid-area: track;
      align-self: center;
      height: 4px;
      background: var(--track);
      box-shadow: none;
    }

    .fill {
      background-image: none;
      box-shadow: none;
    }

    .reset {
      grid-area: reset;
      margin-top: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      font-size: 10px;
      line-height: 13px;
      font-weight: 400;
    }

    .switch {
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      line-height: 20px;
    }

    .switch[data-active="true"] {
      background: color-mix(in srgb, var(--projects) 24%, transparent);
      box-shadow: none;
    }

    .codex-stale,
    .codex-credits,
    .codex-account-head {
      font-size: 11px;
    }

    .codex-account + .codex-account {
      margin-top: 8px;
      padding-top: 8px;
    }

    .codex-account-head {
      margin-bottom: 5px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .card[data-card="projects"] .brand {
      grid-template-columns: 18px minmax(0, 1fr);
      row-gap: 8px;
      margin-bottom: 4px;
    }

    .project-actions {
      gap: 6px;
    }

    .proj-row {
      grid-template-columns: 14px minmax(0, 1fr) auto auto;
      gap: 6px;
      padding: 5px 0 7px;
      font-size: 12px;
      line-height: 16px;
    }

    .proj-rank {
      width: 14px;
      height: 14px;
      font-size: 9px;
      font-weight: 600;
    }

    .proj-tokens {
      min-width: 44px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .proj-cost {
      font-size: 11px;
      letter-spacing: 0;
    }

    .proj-bar,
    .proj-row:first-child .proj-bar {
      height: 2px;
    }

    /* Footer: today's total with icon-only Refresh / Quit on its right, the
       status text on its own caption line below. Language-independent: no
       row ever wraps, whatever the length of the translated labels. */
    .footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "alerts alerts"
        "today actions"
        "meta meta";
      align-items: center;
      column-gap: 8px;
      row-gap: 3px;
      min-height: 0;
      padding: 10px 0 2px;
    }

    [data-footer="service-alerts"] {
      grid-area: alerts;
    }

    .service-alert {
      margin-bottom: 0;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
    }

    .today {
      grid-area: today;
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .meta {
      grid-area: meta;
      flex-wrap: nowrap;
      gap: 0;
      min-width: 0;
      overflow: hidden;
    }

    .meta > div {
      flex: 0 1 auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      font-size: 10px;
      line-height: 13px;
      font-weight: 400;
    }

    .meta > div + div::before {
      content: "\00a0·\00a0";
    }

    .actions {
      grid-area: actions;
      gap: 2px;
      margin-top: 0;
    }

    .action,
    .action.primary,
    .action[data-action="install"][data-visible="true"] {
      flex: none;
      min-height: 20px;
      padding: 0 6px;
      border: 0;
      border-radius: 5px;
      background: none;
      box-shadow: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 20px;
      white-space: nowrap;
    }

    .action.primary {
      color: var(--codex);
    }

    /* The i18n label stays in the DOM for screen readers; only the glyph shows. */
    .action[data-action="refresh"],
    .action[data-action="quit"] {
      width: 22px;
      padding: 0;
      font-size: 0;
    }

    .action[data-action="refresh"]::before,
    .action[data-action="quit"]::before {
      font-size: 13px;
      line-height: 20px;
    }

    .action[data-action="refresh"]::before {
      content: "↻";
    }

    .action[data-action="quit"]::before {
      content: "⏻";
    }

    .action:hover,
    .action.primary:hover,
    .action:not(.primary):hover {
      border: 0;
      background: var(--button-hover);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" data-card="claude" style="--accent: var(--claude)">
      <header class="brand">
        <img src="{{CLAUDE_ICON}}" alt="">
        <h1 data-i18n="claude_name">Claude Code</h1>
        <button class="switch" data-action="switch" data-i18n="switch_panel">⇄ Switch Panel</button>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="codex" style="--accent: var(--codex)">
      <header class="brand">
        <img src="{{CODEX_ICON}}" alt="">
        <h1 data-i18n="codex_name">Codex</h1>
        <div class="codex-stale" data-codex-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-codex-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
      <div class="codex-accounts" data-codex-accounts></div>
    </section>

    <section class="card" data-card="agy" style="--accent: var(--agy)">
      <header class="brand">
        <div class="brand-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
        <h1 data-i18n="agy_name">Antigravity</h1>
        <button type="button" class="agy-group-toggle" data-action="set_agy_quota_group" title="" aria-label=""></button>
        <div class="codex-stale" data-agy-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-agy-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-agy-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="grok" style="--accent: var(--grok)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
        <h1 data-i18n="grok_name">Grok</h1>
        <div class="codex-stale" data-grok-stale hidden>
          <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="projects" style="--accent: var(--projects)">
      <header class="brand">
        <div class="brand-icon"><svg width="30" height="30" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.75 8.25C4.75 7.14543 5.64543 6.25 6.75 6.25H10.5729C10.9737 6.25 11.3598 6.40073 11.6548 6.67228L12.9952 7.90522C13.2902 8.17677 13.6763 8.3275 14.0771 8.3275H19.25C20.3546 8.3275 21.25 9.22293 21.25 10.3275V17.75C21.25 18.8546 20.3546 19.75 19.25 19.75H6.75C5.64543 19.75 4.75 18.8546 4.75 17.75V8.25Z" stroke="var(--projects)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.25 11.25H18.75" stroke="var(--projects)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/><path d="M8.75 14.15C8.75 13.4596 9.30964 12.9 10 12.9H10.3C10.9904 12.9 11.55 13.4596 11.55 14.15V16.5H8.75V14.15Z" fill="var(--projects)" opacity="0.18" stroke="var(--projects)" stroke-width="1.4"/><path d="M12.6 13.25C12.6 12.6425 13.0925 12.15 13.7 12.15H14.05C14.6575 12.15 15.15 12.6425 15.15 13.25V16.5H12.6V13.25Z" fill="var(--projects)" opacity="0.3" stroke="var(--projects)" stroke-width="1.4"/><path d="M16.2 14.85C16.2 14.1873 16.7373 13.65 17.4 13.65H17.75C18.4127 13.65 18.95 14.1873 18.95 14.85V16.5H16.2V14.85Z" fill="var(--projects)" opacity="0.48" stroke="var(--projects)" stroke-width="1.4"/></svg></div>
        <h1 data-i18n="projects_title">Project Usage</h1>
        <div class="codex-stale" data-history-error hidden>
          <span aria-hidden="true">⚠</span>
          <span data-history-error-text></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-history-error-tooltip></span>
          </span>
        </div>
        <div class="project-actions">
          <button class="switch" data-action="toggle-project-range">Today</button>
          <button class="switch" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
          <button class="switch" data-action="toggle-statusline" data-i18n="cli">CLI</button>
        </div>
      </header>
      <div data-project-list></div>
    </section>

    <section class="footer">
      <div data-footer="service-alerts" hidden></div>
      <div class="meta">
        <div data-footer="rate">Rate: --</div>
        <div data-footer="status">Status: Loading</div>
      </div>
      <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>

      <div class="actions">
        <button class="action primary" data-action="refresh" data-i18n="refresh_now" data-i18n-title="refresh_now">↻ Refresh Now</button>
        <button class="action" data-action="quit" data-i18n="quit" data-i18n-title="quit">⏻ Quit</button>
        <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
      </div>
    </section>
  </main>

  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>
